spring:
  application:
    name: linko
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/linko_ms}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations:
    - classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
short:
  application-url: ${SHORT_APPLICATION_URL:http://localhost:8080}
  expiration: ${SHORT_EXPIRATION:P3M}
cache:
  redis:
    time-to-live: ${CACHE_REDIS_TTL:PT10M}